name: Girlies OTA Update

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Publish OTA
        run: npx eas-cli@latest update --channel preview --message "Girlies update"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
