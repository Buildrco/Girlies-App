name: Girlies OTA Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo Router is installed
        run: node -e "require.resolve('expo-router/package.json'); console.log('expo-router OK')"

      - name: Publish Android OTA
        run: npx eas-cli@latest update --platform android --channel preview --message "Girlies preview OTA update" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
