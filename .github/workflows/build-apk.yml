name: Build Girlies APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build APK
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          BUILD_URL=$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const build=Array.isArray(value)?value[0]:value; process.stdout.write(build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || '');")
          test -n "$BUILD_URL"
          npx eas-cli@latest build:download --url "$BUILD_URL" --output girlies-preview.apk --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: girlies-preview-apk
          path: app/girlies-preview.apk
          if-no-files-found: error
          retention-days: 14
